<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    .pr-wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 56px; }
    .pr-card { background: #fff; border: 1px solid rgba(0,0,0,.07); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start; }
    .pr-avatar { width: 36px; height: 36px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pr-body { flex: 1; min-width: 0; }
    .pr-time { font-size: 11.5px; color: #6b7280; }
    .pr-text { font-size: 13.5px; color: #374151; line-height: 1.6; margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
    .pr-count { font-size: 11.5px; color: var(--gold); margin-top: 6px; }
    .pr-del { width: 34px; height: 34px; border: none; border-radius: 9px; background: #fef2f2; color: #ef4444; cursor: pointer; flex-shrink: 0; }
    .pr-del:hover { background: #ef4444; color: #fff; }
    .pr-msg { text-align: center; color: #6b7280; font-size: 14px; padding: 40px 10px; }
    .pr-role { font-size: 12px; color: #6b7280; margin-bottom: 14px; }
  </style>
</head>

  <div class="hero">
    <div class="d-flex align-items-center gap-3">

      <div>

    </div>
  </div>

  <div class="pr-wrap">
    <div id="prayerMain"><p class="pr-msg">Loading…</p></div>
  </div>
