<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in – RCCG Chapel of Grace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    .ci-wrap { max-width: 440px; margin: 0 auto; padding: 40px 16px; }
    .ci-card { background: #fff; border: 1px solid rgba(0,0,0,.07); border-radius: 22px; padding: 34px 24px; text-align: center; box-shadow: 0 12px 34px rgba(11,31,75,.1); }
    .ci-icon { font-size: 3.2rem; margin-bottom: 10px; }
    .ci-card h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.35rem; color: #111827; margin-bottom: 6px; }
    .ci-card p { font-size: 13.5px; color: #6b7280; margin: 0 0 18px; line-height: 1.6; }
    .ci-ok  .ci-icon { color: #16a34a; }
    .ci-bad .ci-icon { color: #ef4444; }
    .ci-link { display: inline-block; padding: 11px 22px; border-radius: 12px; background: linear-gradient(135deg,#0b1f4b,#0d2a66); color: #fff; font-weight: 600; font-size: 13.5px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="ci-wrap"><div class="ci-card" id="ciCard"><p>Checking…</p></div></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="shared.js"></script>
  <script src="access.js"></script>
  <script src="checkin.js"></script>
</body>
</html>
