<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ushers' Portal – RCCG Chapel of Grace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    .qr-wrap { max-width: 460px; margin: 0 auto; padding: 28px 16px 56px; }
    .qr-card { background: #fff; border: 1px solid rgba(0,0,0,.07); border-radius: 22px; padding: 28px 22px; text-align: center; box-shadow: 0 12px 34px rgba(11,31,75,.1); }
    .qr-card h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.3rem; color: #111827; margin-bottom: 4px; }
    .qr-card p  { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
    #qrBox { display: inline-block; padding: 14px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; min-height: 100px; }
    #qrBox canvas, #qrBox img { display: block; max-width: 100%; height: auto; }
    .qr-status { font-size: 12.5px; color: #6b7280; margin-top: 14px; }
    .qr-bar { height: 5px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 14px auto 0; max-width: 260px; }
    .qr-bar > div { height: 100%; width: 100%; background: var(--gold); transition: width 1s linear; }
    .qr-actions { display: flex; gap: 10px; margin-top: 18px; }
    .qr-actions button { flex: 1; padding: 12px; border-radius: 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .qr-start { background: linear-gradient(135deg,#0b1f4b,#0d2a66); color: #fff; border: none; }
    .qr-stop  { background: #fff; color: #991b1b; border: 1.5px solid #fecaca; }
    .qr-msg { text-align: center; color: #6b7280; font-size: 14px; padding: 40px 10px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="d-flex align-items-center gap-3">
      <a href="index.html" class="hero-back" aria-label="Back to portals"><i class="bi bi-arrow-left fs-5"></i></a>
      <div>
        <div class="hero-eyebrow">RCCG Chapel of Grace</div>
        <h2>Ushers' Portal</h2>
      </div>
    </div>
  </div>

  <div class="qr-wrap">
    <div id="usherMain"><p class="qr-msg">Loading…</p></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="shared.js"></script>
  <script src="access.js"></script>
  <script src="usher.js"></script>
</body>
</html>
